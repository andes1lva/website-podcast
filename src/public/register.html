<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-signin-client_id" content="410645476258-e647i57asbp21nd5jdtkqd5qg35civ93.apps.googleusercontent.com">
    <title>Criar Conta - Web Podcast Tech</title>
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Criar Conta</h2>
            <p>Junte-se à nossa comunidade</p>
            
            <form id="registerForm">
                <div class="form-group mb-3">
                    <label for="username"><i class="fas fa-user mr-1"></i> Nome Completo</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Seu nome" required />
                </div>

                <div class="form-group mb-3">
                    <label for="email"><i class="fas fa-envelope mr-1"></i> E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required />
                </div>

                <div class="form-group mb-3">
                    <label for="address"><i class="fas fa-map-marker-alt mr-1"></i> Endereço</label>
                    <input type="text" class="form-control" id="address" name="address" placeholder="Rua, Número, Bairro" required />
                </div>

                <div class="form-group mb-4">
                    <label for="password"><i class="fas fa-lock mr-1"></i> Senha</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Crie uma senha forte" required />
                </div>

                <button type="submit" id="btnRegister" class="btn btn-primary btn-block py-2">Finalizar Cadastro</button>
            </form>

            <div class="auth-footer-links">
                <a href="/login.html">Já tem uma conta? Faça login aqui</a>
            </div>
        </div>
    </div>

    <script src="/js/client.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
