<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-signin-client_id" content="410645476258-e647i57asbp21nd5jdtkqd5qg35civ93.apps.googleusercontent.com">
    <title>Login</title>
    <link rel="stylesheet" href="/website-podcast/src/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
    <script src="https://apis.google.com/js/platform.js" async defer></script>
</head>
<body>
    <div class="register-card p-4 ">
    <h2 class="text-center mb-4">Criar Conta</h2>
    <form id="registerForm">
        <!-- Nome Completo -->
        <div class="form-group mb-3">
            <label for="username"><i class="fas fa-user"></i> Nome Completo</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu nome" required />
        </div>

        <!-- Email -->
        <div class="form-group mb-3">
            <label for="email"><i class="fas fa-envelope"></i> E-mail</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required />
        </div>

        <!-- Endereço -->
        <div class="form-group mb-3">
            <label for="address"><i class="fas fa-map-marker-alt"></i> Endereço</label>
            <input type="text" class="form-control" id="address" name="address" placeholder="Rua, Número, Bairro" required />
        </div>

        <!-- Senha -->
        <div class="form-group mb-4">
            <label for="password"><i class="fas fa-lock"></i> Senha</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Crie uma senha forte" required />
        </div>

        <button type="submit" id="btnRegister" class="btn btn-primary btn-block py-2">
            Finalizar Cadastro
        </button>
    </form>
    <div class="text-center mt-3">
        <a href="/website-podcast/src/public/login.html" class="small text-muted">Já tem uma conta? Faça login aqui</a>
    </div>
</div>
    <script src="/src/script/client.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</body>
</html>
