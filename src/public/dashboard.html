<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Web Podcast Tech</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dashboard-page">

    <div class="app-container" id="mainContainer">
        <aside class="sidebar-apple">
            <div class="sidebar-header mb-5">
                <h4 class="font-weight-bold"><i class="fas fa-podcast text-primary"></i> HEXTEC Podcast</h4>
                <!-- Indicador de Sessão HEXTEC -->
                <div class="session-status mt-2">Sessão Ativa</div>
            </div>
            
            <nav class="nav flex-column">
                <a href="#" class="nav-item-apple active"><i class="fas fa-home mr-3"></i> Início</a>
                <a href="#" class="nav-item-apple"><i class="fas fa-bolt mr-3"></i> Novidades</a>
                <a href="#" class="nav-item-apple mt-4"><i class="fas fa-book mr-3"></i> Blog</a>
            </nav>

            <div class="radiocast-container mt-auto">
                <div class="visor-led mb-3">
                    <span class="freq">95.5 MHz</span>
                    <span class="status small d-block">ON AIR</span>
                </div>
                <div class="player-controls d-flex justify-content-between">
                    <button class="btn btn-sm btn-dark"><i class="fas fa-step-backward"></i></button>
                    <button class="btn btn-sm btn-primary px-3" id="playerPlay"><i class="fas fa-play"></i></button>
                    <button class="btn btn-sm btn-dark"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="d-flex justify-content-end mb-4">
                <div class="user-badge p-2 px-3 border border-secondary rounded-pill">
                    <small class="text-muted"><i class="fas fa-user-shield text-primary mr-2"></i> Anderson Oliveira (HEXTEC Admin)</small>
                </div>
            </div>

            <header class="mb-5">
                <h1 class="display-4 font-weight-bold">Best Channels</h1>
                <p class="lead text-muted">Best Channels now</p>
            </header>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card-podcast" id="cardAcesso">
                        <h5 class="text-primary font-weight-bold mb-3">Conteúdo Restrito</h5>
                        <p class="text-muted small">Clique abaixo para validar sua sessão e liberar os arquivos.</p>
                        <hr class="border-secondary">
                        <button id="btnAbrirConteudo" class="btn btn-outline-primary btn-block">Abrir Conteúdo</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
